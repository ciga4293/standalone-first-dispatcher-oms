# =============================================================================
# DOCKER COMPOSE HOMELAB & VPS DEPLOYMENT
# Multi-Container Orchestration: PostgreSQL + Next.js + FastAPI + dbt
# =============================================================================
version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 1. PostgreSQL Database Service (OLTP Data Store)
  # ---------------------------------------------------------------------------
  postgres_db:
    image: postgres:15-alpine
    container_name: dispatcher_postgres_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: ${DB_NAME:-dispatcher_oncall_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql
      - ./db/seeds/001_seed_data.sql:/docker-entrypoint-initdb.d/002_seed_data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-dispatcher_oncall_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # 2. FastAPI Python Backend Service
  # ---------------------------------------------------------------------------
  fastapi_backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: dispatcher_fastapi_backend
    restart: always
    environment:
      DB_HOST: postgres_db
      DB_PORT: 5432
      DB_USER: ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      DB_NAME: ${DB_NAME:-dispatcher_oncall_db}
    ports:
      - "8000:8000"
    depends_on:
      postgres_db:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # 3. Next.js Frontend Web Application Service
  # ---------------------------------------------------------------------------
  nextjs_frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: dispatcher_nextjs_frontend
    restart: always
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - fastapi_backend

volumes:
  postgres_data:
    driver: local
