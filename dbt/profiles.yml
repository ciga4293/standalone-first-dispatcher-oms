# Profile dbt untuk koneksi ke PostgreSQL Homelab / Local Dev
# Gunakan dbt CLI dengan command: dbt run --profiles-dir .

dispatcher_oms_profile:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('DB_HOST', 'localhost') }}"
      user: "{{ env_var('DB_USER', 'postgres') }}"
      password: "{{ env_var('DB_PASSWORD', 'password') }}"
      port: "{{ env_var('DB_PORT', '5432') | int }}"
      dbname: "{{ env_var('DB_NAME', 'dispatcher_oncall_db') }}"
      schema: public
      threads: 4
      keepalives_idle: 0
